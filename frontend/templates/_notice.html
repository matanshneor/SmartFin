{# A one-time message from the server, e.g. "your family changed" (see
   _family_changed). Taken from the session, so shown once only, and core.js
   shows it as a toast. #}
{% set sf_notice = session.pop('sf_notice', None) %}
{% if sf_notice %}<script type="application/json" id="sfNotice">{{ sf_notice | tojson }}</script>{% endif %}
