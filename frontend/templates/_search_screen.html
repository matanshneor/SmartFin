{# The search-all-months screen, on home and the month page (Matan, 12.10).
   Outside `main`: the soft refresh replaces only the content, and the screen
   stays one. #}
<div class="search-screen" id="searchScreen" role="dialog" aria-modal="true" aria-label="חיפוש בכל העסקאות" hidden>
    <div class="search-bar">
        <svg class="search-bar-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <input type="search" class="search-input" id="searchInput" placeholder="חיפוש בכל החודשים…"
               aria-label="מה לחפש" autocomplete="off" enterkeyhint="search" maxlength="80">
        <button type="button" class="search-close" id="searchClose" aria-label="סגירת החיפוש">✕</button>
    </div>
    <p class="search-summary" id="searchSummary" aria-live="polite">תיאור, קטגוריה, מקום עבודה, פרויקט או סכום</p>
    <div class="search-results" id="searchResults"></div>
</div>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
