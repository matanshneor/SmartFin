# Lock of transitive dependencies, generated from requirements.txt.
#
# requirements.txt pins what we choose explicitly (Flask, supabase, gunicorn…).
# Everything else (postgrest, gotrue, storage3, realtime, pydantic, httpcore) is
# resolved again on every build, meaning a new version of a dependency we don't
# even know enters production without anyone approving it. That is both a source
# of random breakage and a supply-chain surface.
#
# To refresh after a change to requirements.txt:
#   python3 -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install -r requirements.txt
#   /tmp/lockenv/bin/pip freeze > requirements.lock
#
# The deploy uses requirements.txt (see Procfile/Railway); this file is the record
# of what was actually resolved, and what pip-audit in CI scans.
