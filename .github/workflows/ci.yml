# Checks before deploying.
#
# The need is real and immediate: a push to main triggers an automatic deploy on
# Railway, so breaking code goes live with nothing stopping it on the way. Until now
# this worked because one person touches the code and runs tests by hand; from the
# moment there are real users this safety net has to be automatic.
#
# Only the unit tests run (-m unit). They don't touch Supabase, so no secret at all
# is needed on GitHub, and that is a decision, not a compromise: production keys in
# CI are a new attack surface, and tests talking to the real database would also
# change it. The integration tests keep running locally against the linked project.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python version from runtime.txt
        # setup-python reads the file but doesn't strip the "python-" prefix of the
        # Heroku format Railway uses. It is cut here so the CI version and the
        # production version stay one source of truth.
        id: py
        run: echo "version=$(sed 's/^python-//' runtime.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt   # includes -r requirements.txt

      - name: Unit tests
        # A dummy value: the app refuses to start without SECRET_KEY, and that is a
        # deliberate guard. It has nothing to do with the real key on Railway.
        env:
          SECRET_KEY: ci-only-not-a-real-secret
        # --cov-fail-under is a floor, not a target and not a grade: below the
        # current state, only so coverage doesn't silently vanish. That is exactly
        # what happened to the money routes: add, edit, delete and reset weren't
        # tested at all while 524 tests ran green. Raising the number is a
        # conscious decision, not a side effect of a refactor.
        run: python -m pytest tests/ -m unit -q --cov=backend --cov-report=term --cov-fail-under=55

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Python version from runtime.txt
        # setup-python reads the file but doesn't strip the "python-" prefix of the
        # Heroku format Railway uses. It is cut here so the CI version and the
        # production version stay one source of truth.
        id: py
        run: echo "version=$(sed 's/^python-//' runtime.txt)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.py.outputs.version }}

      - name: Scan dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off
          # And the lock too: requirements.txt pins only what was chosen
          # explicitly, and everything else (postgrest, gotrue, pydantic,
          # httpcore…) is resolved again on every build. Scanning only the direct
          # ones misses exactly the part nobody approved.
          pip-audit -r requirements.lock --progress-spinner off
